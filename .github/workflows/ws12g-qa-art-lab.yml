name: WS-12G QA Art Lab, Debug APK and Release Art Isolation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ws12g-qa-art-lab-android-v51-2026-11-08
      - feature/ws12j-owner-book-navigation-and-compact-pages-v54-2026-11-08
      - feature/ws12k-cohesive-illustrated-book-variants-qa-v55-2026-11-08
      - feature/ws13a-real-mobile-bookcase-v56-2026-11-08
    paths:
      - 'app/**'
      - 'tools/asset_pipeline/**'
      - 'design/asset-pipeline/**'
      - 'design/visual-system/**'
      - '.github/workflows/ws12g-qa-art-lab.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/asset_pipeline/**'
      - 'design/asset-pipeline/**'
      - 'design/visual-system/**'
      - '.github/workflows/ws12g-qa-art-lab.yml'

permissions:
  contents: read
concurrency:
  group: ws12g-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-art-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original approved Woodland portraits (pinned)
        uses: actions/checkout@v4
        with:
          repository: PlayerEden/SudokuTogether
          ref: 975e31a1e8cbfebad1fbbc7602b3340c357da7ef
          path: _approved_sudoku
          persist-credentials: false
      - name: Restore original 12 Woodland portraits by verified hashes
        run: python3 scripts/import_woodland_portraits.py --source _approved_sudoku
      - name: Checkout approved OFL font sources (pinned, sparse)
        uses: actions/checkout@v4
        with:
          repository: google/fonts
          ref: 24ddc1f324cac5d9f5aedca126d298f56e3f1640
          path: _approved_fonts
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            ofl/atkinsonhyperlegible
            ofl/ibmplexmono
            ofl/dmmono
            ofl/patrickhand
      - name: Import original reviewed font resources and licenses
        run: |
          python3 -m pip install --disable-pip-version-check --user fonttools==4.59.2
          python3 scripts/import_font_library.py --source _approved_fonts
      - name: Import six QA sprites from the hash-pinned original sheet
        if: ${{ hashFiles('design/visual-system/masters/ws14-generated-asset-sheet-original.png') != '' }}
        run: |
          python3 -m pip install --disable-pip-version-check --user Pillow==12.3.0
          python3 tools/asset_pipeline/import_ws14_candidate_sheet.py
      - name: Check WS-14 real-art registry integrity and approval gates
        run: |
          python3 tools/asset_pipeline/validate_ws14_assets.py
          python3 -m unittest discover -s tools/asset_pipeline -p 'test_ws14_asset_registry.py' -v
          python3 -m unittest discover -s tools/asset_pipeline -p 'test_ws14_cover_import.py' -v
      - name: Install pinned build-only SVG renderer (no Android runtime dependency)
        run: python3 -m pip install --disable-pip-version-check --user CairoSVG==2.8.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Guard exact original artwork SHA and optional illustrated study source
        run: python3 -m unittest discover -s tools/asset_pipeline -p 'test_field_notes_study.py' -v
      - name: Compile Android DEBUG with both A/B art studies and RELEASE without them
        run: gradle --no-daemon :core:test :app:assembleDebug :app:assembleRelease --console=plain
      - name: Verify WS-14 actual original cover exports and debug/release asset isolation
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          data=json.loads(pathlib.Path("design/visual-system/ws14-art-register.json").read_text())
          qa=pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          releases=list(pathlib.Path("app/build/outputs/apk/release").glob("*.apk"))
          assert qa.is_file() and releases, "Missing debug or release APK"
          expected={}
          for art in data["assets"]:
              if art["purpose"] not in ("front-cover-art", "spine-ornament-art"):
                  continue
              assert art["status"] in ("QA_INTEGRATED","GENERATED_UNREVIEWED"), "Artwork review state must remain non-release"
              for item in art["exports"]:
                  if item["android_source_set"] == "debug":
                      src=pathlib.Path(item["path"])
                      assert src.is_file() and src.as_posix().startswith("app/src/debug/assets/ws14/")
                      folder = "books" if art["purpose"] == "front-cover-art" else "spines"
                      assert src.parent.name == folder, "Unexpected folder for WS-14 sprite"
                      expected["assets/ws14/"+folder+"/"+src.name]=item["sha256"]
          with zipfile.ZipFile(qa) as apk:
              actual={p for p in apk.namelist() if p.startswith("assets/ws14/")}
              assert actual == set(expected), ("Missing or unexpected WS-14 QA sprites",actual,expected)
              for name,digest in expected.items():
                  assert hashlib.sha256(apk.read(name)).hexdigest()==digest, name
          with zipfile.ZipFile(releases[0]) as apk:
              assert not [p for p in apk.namelist() if p.startswith("assets/ws14/")], "WS-14 QA ART LEAKED INTO RELEASE"
          print("WS-14 cover/spine sprites verified:", len(expected), "debug-only; zero in release")
          PY
      - name: Verify each exact-source A/B SVG and PNG inside QA and zero in release
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile, hashlib
          root=pathlib.Path('app/src/debug/assets/ws12')
          manifest=json.loads((root/'render_sha256.json').read_text())
          assert manifest['art_file_count']==18, manifest
          assert manifest['owner_approved'] is False
          assert manifest['android_resources_modified'] is False
          for rel, expected in manifest['files'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest() == expected
          debug=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          releases=list(pathlib.Path('app/build/outputs/apk/release').glob('*.apk'))
          assert debug.is_file() and releases, 'Missing debug or release APK'
          with zipfile.ZipFile(debug) as z:
              art=[x for x in z.namelist() if x.startswith('assets/ws12/') and x.endswith('.svg') and '/alt/' not in x]
              assert len(art)==18, (len(art),art)
              assert 'assets/ws12/review.html' in z.namelist()
              assert 'assets/ws12/render_sha256.json' in z.namelist()
              assert z.read('assets/ws12/review.html').count(b'<h2>')==3
              pngs=[x for x in z.namelist()
                    if x.startswith('assets/ws12/raster/') and x.endswith('.png')]
              assert len(pngs)==18, ('raster artwork missing',len(pngs))
              raster=json.loads(z.read('assets/ws12/raster/manifest.json'))
              assert raster['art_count']==18 and raster['owner_approved'] is False
              for name, meta in raster['art'].items():
                  path='assets/ws12/raster/'+name
                  assert hashlib.sha256(z.read(path)).hexdigest()==meta['sha256']
                  svg='assets/ws12/'+name.replace('.png','.svg')
                  assert hashlib.sha256(z.read(svg)).hexdigest()==meta['source_sha256']
              # Study B always extends an exact A file. Every generated B sprite
              # is checked against its separate receipt inside the actual APK.
              alt=json.loads(z.read('assets/ws12/alt/field-notes/render_sha256.json'))
              assert alt['art_file_count']==18 and alt['owner_approved'] is False
              assert alt['source_original_files_unchanged']
              for name, sha in alt['files'].items():
                  alt_path='assets/ws12/alt/field-notes/'+name
                  a_path='assets/ws12/'+name
                  assert hashlib.sha256(z.read(alt_path)).hexdigest()==sha
                  assert hashlib.sha256(z.read(a_path)).hexdigest()==alt['original_source_hashes'][name]
                  assert z.read(a_path)!=z.read(alt_path)
              alt_png=json.loads(z.read('assets/ws12/raster_field_notes/manifest.json'))
              assert alt_png['art_count']==18 and alt_png['owner_approved'] is False
              for name, meta in alt_png['art'].items():
                  path='assets/ws12/raster_field_notes/'+name
                  assert hashlib.sha256(z.read(path)).hexdigest()==meta['sha256']
                  source='assets/ws12/alt/field-notes/'+name.replace('.png','.svg')
                  assert hashlib.sha256(z.read(source)).hexdigest()==meta['source_sha256']
              assert z.read('assets/ws12/compare-studies.html').count(b'<article')==6
          with zipfile.ZipFile(releases[0]) as z:
              assert not [x for x in z.namelist() if x.startswith('assets/ws12/')], 'PROTOTYPE ART LEAKED TO RELEASE'
          print('PASS: 18 original and 18 new alt source SVGs, plus 36 SHA-matched native PNGs in QA; ZERO in release.')
          PY
      - name: Upload install-over QA Art Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: GRIDMATES-WS14A-VISUAL-KIT-ANDROID-V57-QA-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Clarify source and execution limits
        run: |
          {
            echo '### WS-14A unified native visual components · unapproved art remains isolated'
            echo 'Debug APK has 18 original + 18 illustrated SVG art and 36 matched native PNG images; release has none.'
            echo 'QA v57 installs over compatible existing signed QA builds; current Solo/Daily/books stores untouched.'
            echo 'Android instrumentation test source is compiled by the separate standard Android QA flow, not executed here.'
            echo 'The artwork is unapproved; QA prototype art is already integrated into book cards and does not affect save/unlock logic.'
          } >> "$GITHUB_STEP_SUMMARY"
