name: Word Search WS05H Profile Collection Settings Android QA

# This workflow is intentionally opt-in / branch-scoped so the free-tier
# Actions budget is not consumed by an emulator on every stacked draft PR.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ws04d-b5-board-fonts-free-achievements-2026-11-06
      - feature/ws05a-coop-session-engine-2026-11-06
      - feature/ws05b-nearby-chat-and-presence-2026-11-06
      - feature/ws05c-chat-delivery-and-connection-reliability-2026-11-06
      - feature/ws05d-host-admission-and-room-lifecycle-2026-11-06
      - feature/ws05e-nearby-discovery-and-rejoin-2026-11-06
      - feature/ws05f-paperback-app-polish-2026-11-06
      - feature/ws05g-gameplay-results-polish-2026-11-06
      - feature/ws05h-profile-collection-settings-polish-2026-11-06
    paths:
      - '.github/workflows/ws04d-b5-android-font-audit.yml'

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original Woodland portraits from approved Sudoku source
        uses: actions/checkout@v4
        with:
          repository: PlayerEden/SudokuTogether
          ref: 975e31a1e8cbfebad1fbbc7602b3340c357da7ef
          path: _approved_sudoku
          persist-credentials: false
      - name: Verify imported artwork
        run: python3 scripts/import_woodland_portraits.py --source _approved_sudoku
      - name: Checkout OFL font sources at approved revision
        uses: actions/checkout@v4
        with:
          repository: google/fonts
          ref: 24ddc1f324cac5d9f5aedca126d298f56e3f1640
          path: _approved_fonts
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            ofl/atkinsonhyperlegible
            ofl/ibmplexmono
            ofl/dmmono
            ofl/patrickhand
      - name: Verify font binary, license, glyphs and import
        run: |
          python3 -m pip install --disable-pip-version-check --user fonttools==4.59.2
          python3 scripts/import_font_library.py --source _approved_fonts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM virtualization on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Execute actual Android instrumentation on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:connectedDebugAndroidTest
            # Gradle instrumentation uninstalls the target package on some
            # runners; reinstall the exact APK before launcher screenshots.
            gradle --no-daemon :app:installDebug
            adb shell pm list packages | grep -F com.playereden.gridmates.wordsearch.qa
            mkdir -p qa-screenshots
            # Gameplay and completed-result screens were captured in the
            # instrumentation test before Gradle removed the test target.
            adb pull /sdcard/Download/ws05g-gameplay.png qa-screenshots/gameplay.png
            adb pull /sdcard/Download/ws05g-results.png qa-screenshots/results.png
            # Real Collection and Settings references captured by WS05H tests.
            adb pull /sdcard/Download/ws05h-profile.png qa-screenshots/profile.png
            adb pull /sdcard/Download/ws05h-fonts.png qa-screenshots/fonts.png
            adb pull /sdcard/Download/ws05h-achievements.png qa-screenshots/achievements.png
            adb pull /sdcard/Download/ws05h-settings.png qa-screenshots/settings.png
            adb shell settings put system font_scale 1.0
            adb shell am force-stop com.playereden.gridmates.wordsearch.qa
            adb shell am start -W -n com.playereden.gridmates.wordsearch.qa/com.playereden.gridmates.wordsearch.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/ws05f-home-default.png
            adb pull /sdcard/ws05f-home-default.png qa-screenshots/home-default.png
            adb shell settings put system font_scale 1.6
            adb shell am force-stop com.playereden.gridmates.wordsearch.qa
            adb shell am start -W -n com.playereden.gridmates.wordsearch.qa/com.playereden.gridmates.wordsearch.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/ws05f-home-large-text.png
            adb pull /sdcard/ws05f-home-large-text.png qa-screenshots/home-large-text.png
            adb shell settings put system font_scale 1.0
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-WS05H-Android-Tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload WS05H profile/achievements/settings visual references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-WS05H-UI-Screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify final installable QA APK SHA256
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload source-matched WS05H QA APK
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-WS05H-QA-v057
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
