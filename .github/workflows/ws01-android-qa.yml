name: GridMates Word Search Android QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'design/woodland/**'
      - '.github/workflows/ws01-android-qa.yml'
      - 'design/font-library-approved-b5.json'

permissions:
  contents: read

# Avoid burning GitHub Actions minutes building superseded PR commits.
# Separate pull requests retain independent workflows, and manual
# workflow_dispatch runs use their own ref-specific group.
concurrency:
  group: wordsearch-standard-android-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Byte-for-byte reuse of the 12 already-approved Sudoku portraits.
      # Pinned source commit prevents an upstream branch edit changing QA art.
      - name: Checkout approved Sudoku Woodland art (pinned)
        uses: actions/checkout@v4
        with:
          repository: PlayerEden/SudokuTogether
          ref: 975e31a1e8cbfebad1fbbc7602b3340c357da7ef
          path: _approved_sudoku
          persist-credentials: false
      - name: Verify and import the 12 approved Woodland portraits
        run: |
          python3 scripts/import_woodland_portraits.py --source _approved_sudoku
      - name: Checkout reviewed OFL fonts (pinned, sparse)
        uses: actions/checkout@v4
        with:
          repository: google/fonts
          ref: 24ddc1f324cac5d9f5aedca126d298f56e3f1640
          path: _approved_fonts
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            ofl/atkinsonhyperlegible
            ofl/ibmplexmono
            ofl/dmmono
            ofl/patrickhand
      - name: Verify and bundle font binaries and license notices
        run: |
          python3 -m pip install --disable-pip-version-check --user fonttools==4.59.2
          python3 scripts/import_font_library.py --source _approved_fonts
      - name: Import hash-pinned WS-14 cover and spine PNGs for this QA APK
        if: ${{ hashFiles('design/visual-system/masters/ws14-generated-asset-sheet-original.png') != '' }}
        run: |
          python3 -m pip install --disable-pip-version-check --user Pillow==12.3.0
          python3 tools/asset_pipeline/import_ws14_candidate_sheet.py
          python3 tools/asset_pipeline/validate_ws14_assets.py
      - name: Install pinned build-only SVG renderer (no Android runtime dependency)
        run: python3 -m pip install --disable-pip-version-check --user CairoSVG==2.8.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" || { echo "Android sdkmanager is missing on the runner"; exit 1; }
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Core + app unit tests, lint and QA APK
        run: gradle --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleDebug
      - name: Verify QA package identity and checksum
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "name='com.playereden.gridmates.wordsearch.qa'"
          echo "Checking four bundled OFL fonts and licenses..."
          for id in atkinson plex_mono dm_mono patrick_hand; do
            unzip -Z1 "$APK" | grep -F "gm_${id}" >/dev/null || {
              echo "::error::Missing packaged font gm_$id"; exit 1;
            }
          done
          for id in atkinson plex dmmono patrick; do
            unzip -Z1 "$APK" | grep -F "font_licenses/${id}_ofl.txt" >/dev/null || {
              echo "::error::Missing bundled font license $id"; exit 1;
            }
          done
          echo "Checking all original Woodland portraits are present in APK..."
          unzip -Z1 "$APK" > /tmp/ws04c-apk-entries.txt
          for name in owl fox rabbit bear badger hedgehog robin deer squirrel otter tortoise cat; do
            grep -F "woodland_${name}" /tmp/ws04c-apk-entries.txt > /dev/null || {
              echo "::error::Missing original Woodland portrait $name in APK"; exit 1;
            }
          done
          sha256sum "$APK"
      - name: Verify illustrated QA APK contains all six source-matched sprites
        if: ${{ hashFiles('design/visual-system/masters/ws14-generated-asset-sheet-original.png') != '' }}
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          manifest = json.loads(Path('design/visual-system/ws14-art-register.json').read_text())
          expected = {}
          for asset in manifest['assets']:
              for export in asset['exports']:
                  if export['android_source_set'] != 'debug':
                      continue
                  source = Path(export['path'])
                  assert source.is_file(), source
                  entry = 'assets/' + str(source).removeprefix('app/src/debug/assets/')
                  expected[entry] = export['sha256']
          assert len(expected) == 6, ('Not all six book sprites registered', expected)
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              actual = {name for name in z.namelist() if name.startswith('assets/ws14/')}
              assert actual == set(expected), ('Unexpected/missing QA sprites', actual, expected)
              for name, digest in expected.items():
                  assert hashlib.sha256(z.read(name)).hexdigest() == digest, name
          print('WS-14D standard QA APK: six original-image-derived sprites packaged with exact hashes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-Woodland-Verified-QA
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
