name: WS-01 Android QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ws01-android-qa.yml'

permissions:
  contents: read

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" || { echo "Android sdkmanager is missing on the runner"; exit 1; }
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Core + app unit tests, lint and QA APK
        run: gradle --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Show built QA APK identity and checksum
        run: |
          ls -lah app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-WS01-QA
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
