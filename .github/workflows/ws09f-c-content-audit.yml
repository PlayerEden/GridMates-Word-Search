name: WS-09F-C V4 Content Supply Lab (Python Only)

# No Android/Gradle downloads during the external 504 incident.
# This is a vocabulary baseline audit, NOT an APK or release signal.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ws09f-c-content-supply-audit-2026-11-08
    paths:
      - 'tools/ws09f_c_content_audit.py'
      - 'tools/ws09f_c_generator_lab.py'
      - 'tools/test_ws09f_c_generator_lab.py'
      - 'design/marathon/v4_candidate_additions.json'
      - '.github/workflows/ws09f-c-content-audit.yml'

permissions:
  contents: read

concurrency:
  group: ws09f-c-vocabulary-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-v3-supply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit frozen v3 vocabulary before version-4 design
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ws09f_c_content_audit.py | tee /tmp/ws09fc-audit.txt
          {
            echo '### WS-09F-C vocabulary supply audit'
            echo 'This is a lab analysis, not proof of 40×40/50×50 gameplay.'
            echo '```'
            cat /tmp/ws09fc-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Frozen research goldens, corruption and deterministic replay tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_ws09f_c_generator_lab.py' -v
      - name: Probe deterministic 40x40 and 50x50 placement / 8-direction uniqueness
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ws09f_c_generator_lab.py | tee /tmp/ws09fc-generator.txt
          {
            echo '### Experimental 40/50 puzzle-generator research'
            echo 'Python-only candidate placement matrix, not the Android Kotlin engine.'
            echo '```'
            cat /tmp/ws09fc-generator.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
