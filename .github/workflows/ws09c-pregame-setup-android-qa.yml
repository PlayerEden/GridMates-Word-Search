name: WS-09C Pre-game Solo Setup Android Emulator QA
# Exact-source v0.8.8/code42 -> v0.8.9/code43 signed update retaining schema5 paused games and 104 Android tests.
# Existing multiple-saved-games fixture exercised by old and updated APKs.
# Trigger only on this workflow file or manual dispatch to conserve Actions minutes.
# The real two-phone Co-op P0 remains open and physical testing is deferred.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ws09c-pregame-setup-2026-11-08
    paths:
      - '.github/workflows/ws09c-pregame-setup-android-qa.yml'

permissions:
  contents: read
  actions: read

jobs:
  race-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download exact previously tested v0.8.8 QA APK
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-WS09B-MultiSolo-v088
          run-id: 42446837690
          github-token: ${{ github.token }}
          repository: PlayerEden/GridMates-Word-Search
          path: qa-baseline
      - name: Verify historical source-matched artifact checksum
        run: |
          echo 'f2e7d2c08bb8b7e37e9ffa92f687757316496173126d873f1d92ac1f65d86f0c  qa-baseline/app-debug.apk' | sha256sum --check
          echo 'cbe50b2b4a34f3a8433e28ddc0efd5307a1adf9aa91e324ca757f40c6aec91ee  qa-signing/wordsearch-qa.p12' | sha256sum --check
      - name: Checkout approved Woodland originals
        uses: actions/checkout@v4
        with:
          repository: PlayerEden/SudokuTogether
          ref: 975e31a1e8cbfebad1fbbc7602b3340c357da7ef
          path: _approved_sudoku
          persist-credentials: false
      - run: python3 scripts/import_woodland_portraits.py --source _approved_sudoku
      - name: Checkout pinned licensed fonts
        uses: actions/checkout@v4
        with:
          repository: google/fonts
          ref: 24ddc1f324cac5d9f5aedca126d298f56e3f1640
          path: _approved_fonts
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            ofl/atkinsonhyperlegible
            ofl/ibmplexmono
            ofl/dmmono
            ofl/patrickhand
      - name: Validate and package fonts and licenses
        run: |
          python3 -m pip install --disable-pip-version-check --user fonttools==4.59.2
          python3 scripts/import_font_library.py --source _approved_fonts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build code43 pre-game Solo setup and saved-library compatibility tests
        run: gradle --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleDebug
      - name: Check APK package version and same trusted QA test signer
        run: |
          OLD=qa-baseline/app-debug.apk
          NEW=app/build/outputs/apk/debug/app-debug.apk
          test -s "$NEW"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$OLD" | grep -F "name='com.playereden.gridmates.wordsearch.qa' versionCode='42'"
          "$AAPT" dump badging "$NEW" | grep -F "name='com.playereden.gridmates.wordsearch.qa' versionCode='43'"
          SIGN="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGN" verify --print-certs "$OLD" | grep 'Signer #1 certificate SHA-256 digest:' > /tmp/oldcert
          "$SIGN" verify --print-certs "$NEW" | grep 'Signer #1 certificate SHA-256 digest:' > /tmp/newcert
          diff -u /tmp/oldcert /tmp/newcert
          cat /tmp/newcert
      - name: Enable KVM for real API35 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run v0.8.8-to-v0.8.9 schema5 multi-save upgrade and 104 Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ./scripts/ws09c_pregame_upgrade_emulator.sh
      - name: Record checksum for cumulative v0.8.9 QA APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-WS09C-Android-Test-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish cumulative stable-signed v0.8.9 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-WS09C-PreGame-v089
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
